<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARMY360 — Manutenção</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #34124d 0%, #16091f 45%, #08050c 100%);
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: min(620px, 100%);
      padding: 48px 28px;
      border: 1px solid rgba(203, 108, 255, 0.45);
      border-radius: 28px;
      background: rgba(18, 12, 24, 0.92);
      box-shadow: 0 0 50px rgba(167, 67, 220, 0.25);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(34px, 7vw, 62px);
    }

    p {
      margin: 8px 0;
      font-size: 18px;
      line-height: 1.6;
    }

    strong {
      color: #d990ff;
    }
  </style>
</head>

<body>
  <main class="box">
    <h1>Site em manutenção</h1>
    <p>Estamos realizando um ajuste rápido no BARMY360.</p>
    <p>O site deve voltar aproximadamente às <strong>23:02</strong>.</p>
    <p>Obrigada pela compreensão 💜</p>
  </main>
</body>
</html>
